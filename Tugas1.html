<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Simpel Estetik</title>
    <style>
        /* Mengimpor font modern dari Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        /* Mengatur tampilan dasar seluruh halaman */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            /* Latar belakang warna gradasi yang lembut */
            background: linear-gradient(135deg, #74ebd5 0%, #acb6e5 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Desain kotak konten utama (Card) */
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 85%;
        }

        /* Gaya untuk judul */
        h1 {
            color: #333;
            margin-top: 0;
            font-weight: 600;
        }

        /* Gaya untuk teks paragraf */
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 15px;
        }

        /* Desain tombol */
        button {
            background-color: #5b86e5;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            /* Animasi saat kursor diarahkan ke tombol */
            transition: all 0.3s ease; 
        }

        /* Efek saat tombol di-hover (disorot kursor) */
        button:hover {
            background-color: #36d1dc;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(54, 209, 220, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Halo Semuanya! 👋</h1>
        <p>Selamat datang di halaman simpel ini!</p>
        <button onclick="alert('Halo! Terima kasih sudah mengklik tombol ini Heheheha 😄')">Klik Saya</button>
    </div>

</body>
</html>
